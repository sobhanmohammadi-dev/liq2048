name: Release

# Push a tag like v1.2.0 to build desktop packages and publish a GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libsdl2-ttf-dev libsdl2-mixer-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja sdl2 sdl2_ttf sdl2_mixer

      - name: "Configure (Linux/macOS, system SDL)"
        if: runner.os != 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: "Configure (Windows, static SDL)"
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DLIQ_FETCH_DEPS=ON

      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -B dist

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  publish:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
