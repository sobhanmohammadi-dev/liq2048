name: Release

# Push a tag like v1.2.0 to build desktop packages and publish a GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Add Persian font to the package (SIL OFL, not stored in the repo)
        shell: bash
        run: |
          curl -sL -o vz.zip https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip
          unzip -j -o vz.zip fonts/ttf/Vazirmatn-Regular.ttf OFL.txt -d vz
          mkdir -p assets/fonts
          cp vz/Vazirmatn-Regular.ttf assets/fonts/fa.ttf
          cp vz/OFL.txt assets/fonts/LICENSE-vazirmatn.txt

      - name: Install dependencies (Linux; SDL is built from source and linked statically)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev libegl1-mesa-dev \
            libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure (Linux, static SDL)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIQ_FETCH_DEPS=ON -DCMAKE_POLICY_VERSION_MINIMUM="3.5"
      - name: Configure (macOS, universal arm64 + x86_64, static SDL)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIQ_FETCH_DEPS=ON -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_POLICY_VERSION_MINIMUM="3.5"
      - name: "Configure (Windows, static SDL)"
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DLIQ_FETCH_DEPS=ON -DCMAKE_POLICY_VERSION_MINIMUM="3.5"

      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -B dist

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  mobile:
    name: Mobile
    uses: ./.github/workflows/mobile.yml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: [package, mobile]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
