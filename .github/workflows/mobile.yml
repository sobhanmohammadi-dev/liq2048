
name: Mobile

# Builds the Android APK/AAB and an unsigned iOS IPA.
# Runs on its own for changes to the mobile project,
# and is called by release.yml for tagged releases.

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ""
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.3.0). Leave empty to use CMakeLists.txt"
        required: false
        type: string
        default: ""

  push:
    branches: [main]
    paths:
      - "android/**"
      - "ios/**"
      - "CMakeLists.txt"
      - "src/**"
      - "assets/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

env:
  SDL_RELEASE: release-2.30.9
  VAZIRMATN_URL: https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          V="${VERSION_INPUT:-}"
          V="${V#v}"

          if [ -z "$V" ]; then
            V=$(awk '
              {
                if (!inside && $0 ~ /^[[:space:]]*project[[:space:]]*\([[:space:]]*Liq2048([[:space:]]|$)/)
                  inside=1

                if (inside && match($0, /VERSION[[:space:]]+[0-9]+(\.[0-9]+)*/)) {
                  v=substr($0, RSTART, RLENGTH)
                  sub(/^VERSION[[:space:]]+/, "", v)
                  print v
                  exit
                }

                if (inside && $0 ~ /^[[:space:]]*\)/)
                  exit
              }
            ' CMakeLists.txt)
          fi

          if [ -z "$V" ]; then
            echo "::error::Could not extract version from CMakeLists.txt"
            exit 1
          fi

          if [[ ! "$V" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Invalid version format: $V"
            exit 1
          fi

          IFS=. read -r MA MI PA <<< "$V"

          MA=${MA:-0}
          MI=${MI:-0}
          PA=${PA:-0}

          MA=$((10#$MA))
          MI=$((10#$MI))
          PA=$((10#$PA))

          if (( MI > 99 || PA > 99 )); then
            echo "::error::Minor and patch versions must be between 0 and 99"
            exit 1
          fi

          CODE=$((MA * 10000 + MI * 100 + PA))

          if (( CODE < 1 || CODE > 2100000000 )); then
            echo "::error::Android versionCode is outside the supported range: $CODE"
            exit 1
          fi

          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

          echo "Using version: $V"
          echo "Android versionCode: $CODE"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          allow-insecure-protocol: false
          gradle-home-cache-cleanup: true

      # Explicitly override v3's deprecated default package list.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        run: |
          sdkmanager --install \
            "ndk;26.3.11579264" \
            "cmake;3.22.1" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Fetch SDL (Java glue + native sources)
        run: |
          git clone --depth 1 --branch "$SDL_RELEASE" \
            https://github.com/libsdl-org/SDL.git android/SDL

      - name: Add Persian font to the app bundle (SIL OFL)
        run: |
          curl -fsSL -o /tmp/vz.zip "$VAZIRMATN_URL"

          mkdir -p /tmp/vz

          unzip -j -o /tmp/vz.zip \
            fonts/ttf/Vazirmatn-Regular.ttf \
            OFL.txt -d /tmp/vz

          mkdir -p assets/fonts
          cp /tmp/vz/Vazirmatn-Regular.ttf assets/fonts/fa.ttf
          cp /tmp/vz/OFL.txt assets/fonts/LICENSE-vazirmatn.txt

      - name: Decode signing key (optional)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${KS:-}" ]; then
            printf '%s' "$KS" | base64 --decode > "$RUNNER_TEMP/release.jks"

            echo "LIQ_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "LIQ_KEYSTORE_PASSWORD=$KS_PASSWORD" >> "$GITHUB_ENV"
            echo "LIQ_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "LIQ_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and AAB
        env:
          LIQ_VERSION: ${{ steps.ver.outputs.version }}
          LIQ_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          gradle -p android assembleRelease bundleRelease \
            -PliqVersion="$LIQ_VERSION" \
            -PliqVersionCode="$LIQ_VERSION_CODE"

      - name: Collect
        env:
          LIQ_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist

          cp android/app/build/outputs/apk/release/*.apk \
            "dist/Liq2048-${LIQ_VERSION}-android.apk"

          cp android/app/build/outputs/bundle/release/*.aab \
            "dist/Liq2048-${LIQ_VERSION}-android.aab"

      - uses: actions/upload-artifact@v7
        with:
          name: package-android
          path: dist/*

  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          V="${VERSION_INPUT:-}"
          V="${V#v}"

          if [ -z "$V" ]; then
            V=$(awk '
              {
                if (!inside && $0 ~ /^[[:space:]]*project[[:space:]]*\([[:space:]]*Liq2048([[:space:]]|$)/)
                  inside=1

                if (inside && match($0, /VERSION[[:space:]]+[0-9]+(\.[0-9]+)*/)) {
                  v=substr($0, RSTART, RLENGTH)
                  sub(/^VERSION[[:space:]]+/, "", v)
                  print v
                  exit
                }

                if (inside && $0 ~ /^[[:space:]]*\)/)
                  exit
              }
            ' CMakeLists.txt)
          fi

          if [ -z "$V" ]; then
            echo "::error::Could not extract version from CMakeLists.txt"
            exit 1
          fi

          if [[ ! "$V" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Invalid version format: $V"
            exit 1
          fi

          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Using iOS version: $V"

      - name: Add Persian font to the app bundle (SIL OFL)
        run: |
          curl -fsSL -o /tmp/vz.zip "$VAZIRMATN_URL"

          mkdir -p /tmp/vz

          unzip -j -o /tmp/vz.zip \
            fonts/ttf/Vazirmatn-Regular.ttf \
            OFL.txt -d /tmp/vz

          mkdir -p assets/fonts
          cp /tmp/vz/Vazirmatn-Regular.ttf assets/fonts/fa.ttf
          cp /tmp/vz/OFL.txt assets/fonts/LICENSE-vazirmatn.txt

      - name: Configure (Xcode, iOS)
        run: >
          cmake -S . -B build-ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DLIQ_BUILD_TESTS=OFF
          -DLIQ_FETCH_DEPS=ON
          -DCMAKE_POLICY_VERSION_MINIMUM="3.5"

      - name: Build (no code signing)
        run: >
          cmake --build build-ios --config Release --
          -sdk iphoneos
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          set -euo pipefail

          APP=$(find build-ios -name "Liq2048.app" \
            -path "*Release-iphoneos*" | head -1)

          test -n "$APP"

          mkdir -p Payload dist
          cp -R "$APP" Payload/

          zip -qry \
            "dist/Liq2048-${{ steps.ver.outputs.version }}-ios-unsigned.ipa" \
            Payload

      - uses: actions/upload-artifact@v7
        with:
          name: package-ios
          path: dist/*
