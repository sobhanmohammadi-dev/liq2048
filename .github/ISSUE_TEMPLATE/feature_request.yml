name: Feature request
description: Suggest an improvement or a new mode / theme / language
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      description: Liq2048 is free forever, with no ads, purchases or dark patterns.
      options:
        - label: This suggestion does not add monetization, tracking or manipulative retention mechanics
          required: true
