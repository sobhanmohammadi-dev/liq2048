plugins {
    id 'com.android.application'
}

// SDL's Java glue (SDLActivity & co.) is taken from the same SDL source tree CMake builds, so the
// Java and native sides always match. CI clones it to android/SDL; locally run:
//   git clone --depth 1 --branch release-2.30.9 https://github.com/libsdl-org/SDL.git android/SDL
def sdlDir = (project.findProperty('sdlDir') ?: "${rootDir}/SDL").toString()
def liqVersion = (project.findProperty('liqVersion') ?: '1.5.0').toString()
def liqVersionCode = (project.findProperty('liqVersionCode') ?: '10500').toString().toInteger()

android {
    namespace 'dev.sobhanmohammadi.liq2048'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'dev.sobhanmohammadi.liq2048'
        minSdk 24
        targetSdk 34
        versionCode liqVersionCode
        versionName liqVersion
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                          '-DLIQ_FETCH_DEPS=ON',
                          '-DLIQ_BUILD_TESTS=OFF',
                          "-DFETCHCONTENT_SOURCE_DIR_SDL2=${sdlDir}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets.main {
        java.srcDirs = ['src/main/java', "${sdlDir}/android-project/app/src/main/java"]
        assets.srcDirs = ['../../assets']
    }

    // Release signing: use LIQ_KEYSTORE* secrets when present (Play Store / your own key); otherwise the
    // debug key, which still produces an APK you can install directly.
    signingConfigs {
        release {
            if (System.getenv('LIQ_KEYSTORE')) {
                storeFile file(System.getenv('LIQ_KEYSTORE'))
                storePassword System.getenv('LIQ_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LIQ_KEY_ALIAS')
                keyPassword System.getenv('LIQ_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('LIQ_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
